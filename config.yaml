cluster:
  node_name: gpu003
  gpu_count: 8
  gpu_model: "NVIDIA H200"

collection:
  interval_seconds: 300  # 5 minutes
  db_path: "data/metrics.db"
  log_sources:
    - path: "/var/log/fabricmanager.log"
      type: "fabricmanager"
    - path: "/var/log/nvidia-dcgm/"
      type: "dcgm"
    - path: "/var/log/ibacm.log"
      type: "infiniband"

llm:
  base_url: "http://localhost:30000/v1"
  model: "Qwen/Qwen3.5-397B-A17B"
  max_tokens: 4096
  temperature: 0.3

analysis:
  anomaly:
    gpu_temp_warn: 75      # Celsius
    gpu_temp_critical: 83
    gpu_power_warn_pct: 90  # % of TDP (700W)
    gpu_memory_warn_pct: 95 # % of total VRAM
    ecc_error_threshold: 1
    zscore_threshold: 3.0
    lookback_hours: 24
  correlation:
    time_window_seconds: 300  # events within 5 min are correlated

reports:
  output_dir: "reports"

prometheus:
  enabled: true
  url: ""  # e.g. "http://master.cluster.local:9090"
  queries:
    - name: "gpu_temperature"
      promql: "DCGM_FI_DEV_GPU_TEMP"
    - name: "gpu_utilization"
      promql: "DCGM_FI_DEV_GPU_UTIL"
    - name: "gpu_memory_used"
      promql: "DCGM_FI_DEV_FB_USED"
    - name: "gpu_power_draw"
      promql: "DCGM_FI_DEV_POWER_USAGE"
    - name: "node_cpu_usage"
      promql: '100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
    - name: "node_memory_available"
      promql: "node_memory_MemAvailable_bytes"

prometheus_s3:
  enabled: true
  bucket: ""              # e.g. "gpu-cluster-prometheus-snapshots"
  prefix: ""              # e.g. "gpu003/" or "snapshots/daily/"
  region: "us-east-1"     # AWS region
  endpoint_url: ""        # Leave empty for AWS S3; set for MinIO/Ceph

alertmanager:
  enabled: true
  url: ""  # e.g. "http://master.cluster.local:9093"

redfish:
  enabled: true
  url: ""  # e.g. "https://bmc-gpu003/redfish/v1"
  username: ""
  password: ""

multinode:
  enabled: true
  nodes:
    - gpu006   # direct SSH as yale (key-based auth)
  ssh_timeout: 5
